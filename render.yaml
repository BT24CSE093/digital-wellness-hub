services:
  # Backend Web Service
  - type: web
    name: digital-wellness-hub-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: digital-wellness-hub-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://digital-wellness-hub.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d

databases:
  # Managed PostgreSQL Database
  - name: digital-wellness-hub-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
